services:
  ip-bot:
    build: .
    container_name: home-cloud-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; import pathlib; p=pathlib.Path('data/healthcheck.txt'); p.write_text('ok')\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s